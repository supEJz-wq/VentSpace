name: Keep Render Awake

# Pings the production API every 10 minutes so Render's free tier doesn't
# spin the backend down (cold starts take 50s+ and browsers abort the
# login/feed requests while it boots, surfacing as CORS/network errors).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://ventspace-o0dt.onrender.com/api/health)
          echo "health status: $code"
          [ "$code" = "200" ] || exit 1
